version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      lint-and-test-tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "vitest"
          - "@vitest/*"
          - "prettier"
      markdown-pipeline:
        patterns:
          - "unified"
          - "remark-*"
          - "rehype-*"
    labels:
      - "type:maintenance"
      - "area:infra"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Shanghai
    labels:
      - "type:maintenance"
      - "area:infra"
