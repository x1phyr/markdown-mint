name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: verify-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release source
        run: pnpm check && pnpm build

      - name: Package source and checksums
        run: |
          mkdir -p release
          git archive --format=tar.gz --prefix="markdown-mint-${GITHUB_REF_NAME}/" --output="release/markdown-mint-${GITHUB_REF_NAME}.tar.gz" HEAD
          sha256sum "release/markdown-mint-${GITHUB_REF_NAME}.tar.gz" > release/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --verify-tag "${release_flags[@]}"
