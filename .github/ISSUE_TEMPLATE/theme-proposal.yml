name: Theme proposal
description: Propose a distinct document theme before implementation.
title: "[Theme]: "
labels: ["type:theme", "area:themes", "status:needs-triage"]
body:
  - type: input
    id: name
    attributes:
      label: Working theme name
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Documents and audience
      description: What documents is this theme designed for, and who reads them?
    validations:
      required: true
  - type: textarea
    id: difference
    attributes:
      label: Difference from existing themes
    validations:
      required: true
  - type: textarea
    id: direction
    attributes:
      label: Visual and typographic direction
      description: Link only to references you are allowed to share; do not copy proprietary templates.
    validations:
      required: true
  - type: textarea
    id: licensing
    attributes:
      label: Fonts, images, and licenses
      description: List proposed assets and redistribution terms.
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: Theme contract
      options:
        - label: I will cover the required components and extreme-content fixtures.
          required: true
        - label: Preview images will be generated by the real rendering pipeline.
          required: true
